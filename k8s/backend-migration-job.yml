apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: devbug-backend:latest
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
