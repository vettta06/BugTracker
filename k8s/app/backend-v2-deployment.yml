
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: devbug
  labels:
    app: backend-v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-v2
  template:
    metadata:
      labels:
        app: backend-v2
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: backend
          image: devbug-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 8001
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: APP_VERSION
              value: "v2.0.0"
          envFrom:
            - configMapRef:
                name: postgres-config
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
