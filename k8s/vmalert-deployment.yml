apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: devbug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.102.0
          args:
            - "-rule=/etc/vmalert/slo-rules.yml"
            - "-datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428"
            - "-remoteWrite.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428"
            - "-evaluationInterval=30s"
          volumeMounts:
            - name: rules-volume
              mountPath: /etc/vmalert
      volumes:
        - name: rules-volume
          configMap:
            name: slo-rules-config
