apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devbug-route
  namespace: devbug
spec:
  parentRefs:
    - name: devbug-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8000
