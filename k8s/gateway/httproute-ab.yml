
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devbug-ab-route
  namespace: devbug
spec:
  parentRefs:
    - name: devbug-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - name: x-user-group
              value: beta
      backendRefs:
        - name: backend-v2
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8000
