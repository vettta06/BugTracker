apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: devbug
data:
  slo-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "SLI-1: HTTP Availability (5m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "sli:http_availability:ratio_rate5m", "legendFormat": "Availability" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.98,
              "max": 1.0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.995 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "SLI-2: HTTP Latency (fast < 500ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "sli:http_latency_fast:ratio_rate5m", "legendFormat": "Fast requests" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.95,
              "max": 1.0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.99 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "SLI-3: Backend Uptime (1m)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "sli:backend_uptime:ratio_rate1m", "legendFormat": "Uptime" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.99,
              "max": 1.0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.999 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Error Budget Remaining",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "slo:http_availability:error_budget_remaining * 100", "legendFormat": "Budget" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 25 },
                  { "color": "green", "value": 50 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Database Availability (pg_up)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "avg_over_time(pg_up{namespace=\"devbug\"}[1m])", "legendFormat": "DB Status" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1
            },
            "overrides": []
          }
        },
        {
          "title": "Business Metrics: Bugs Created",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "VictoriaMetrics" },
          "targets": [
            { "expr": "sum(rate(devbug_bugs_created_total[5m]))", "legendFormat": "Bugs per second" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": []
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["slo", "devbug"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "DevBug SLO",
      "uid": "devbug-slo",
      "version": 1
    }
