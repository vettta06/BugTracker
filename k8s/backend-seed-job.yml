apiVersion: batch/v1
kind: Job
metadata:
  name: backend-seed
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: devbug-backend:latest
          imagePullPolicy: Never
          command: ["python", "seed_db.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
