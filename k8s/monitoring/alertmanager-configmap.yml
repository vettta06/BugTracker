apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: devbug
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: ["alertname", "category"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/bot-token
            chat_id: 5430665405
            send_resolved: true
