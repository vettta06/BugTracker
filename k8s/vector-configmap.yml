apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
data:
  vector.toml: |
    [sources.k8s_logs]
      type = "kubernetes_logs"
      extra_label_selector = "app=backend"

    [transforms.parse_json]
      type = "remap"
      inputs = ["k8s_logs"]
      source = 'parsed, err = parse_json(.message); if err == null { . = merge!(., parsed) }'

    [sinks.victorialogs]
      type = "elasticsearch"
      inputs = ["parse_json"]
      endpoints = ["http://victorialogs.devbug.svc.cluster.local:9428/insert/elasticsearch/"]
      mode = "bulk"
      api_version = "v8"
      healthcheck.enabled = false
      request.headers."VL-Msg-Field" = "event"
      request.headers."VL-Time-Field" = "timestamp"
      request.headers."VL-Stream-Fields" = "service"
