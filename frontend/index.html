<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevBug Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container header-content">
        <h1>DevBug Tracker</h1>
        <button id="openModalBtn" class="btn-primary">+ New Bug</button>
      </div>
    </header>

    <main class="container">
      <div class="list-header">
        <h2>Bug List</h2>
        <span id="bugsCount" class="text-secondary">Loading...</span>
      </div>

      <div id="bugsList" class="bugs-grid">
        <div class="loading-spinner"></div>
      </div>
    </main>

    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <button class="close-btn" aria-label="Close modal">&times;</button>
        <h2 id="modalTitle">Create New Bug</h2>

        <form id="bugForm">
          <input type="hidden" name="bug_id" id="bugId" />

          <div class="form-group">
            <label for="bugTitle">Title</label>
            <input
              type="text"
              id="bugTitle"
              name="title"
              required
              placeholder="e.g., Login error"
            />
          </div>

          <div class="form-group">
            <label for="bugDescription">Description</label>
            <textarea
              id="bugDescription"
              name="description"
              rows="4"
              placeholder="Describe reproduction steps..."
            ></textarea>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="bugStatus">Status</label>
              <select id="bugStatus" name="status">
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="closed">Closed</option>
              </select>
            </div>
            <div class="form-group">
              <label for="bugPriority">Priority</label>
              <select id="bugPriority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="projectSelect">Project</label>
              <select name="project_id" id="projectSelect" required>
                <option value="">Loading...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="userSelect">Assignee</label>
              <select name="assignee_id" id="userSelect" required>
                <option value="">Loading...</option>
              </select>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">
            <span class="btn-text">Save</span>
            <span class="btn-loader" hidden></span>
          </button>
        </form>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
